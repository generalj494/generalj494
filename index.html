<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discorder">
    <meta name="keywords" content="чат, стриминг, discord, neon, real-time">
    <title>Neon Discord - Чат и Стриминг</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="isometric-bg">
        <div class="grid-lines"></div>
        <div class="cube cube-1"></div>
        <div class="cube cube-2"></div>
        <div class="cube cube-3"></div>
        <div class="cube cube-4"></div>
        <div class="cube cube-5"></div>
        <div class="cube cube-6"></div>
        <div class="cube cube-7"></div>
        <div class="cube cube-8"></div>
    </div>
    
    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <h2 class="login-title">Neon Discord</h2>
            <input type="text" id="usernameInput" class="login-input" placeholder="Введите ваше имя" maxlength="20" autocomplete="off">
            <button id="loginBtn" class="login-btn">Подключиться</button>
        </div>
    </div>
    
    <div id="appContainer" class="app-container hidden">
        <div class="sidebar">
            <div class="server-icon">⚡</div>
            <div class="channels">
                <div class="channel-item active" data-channel="general"># Общий чат</div>
                <div class="channel-item" data-channel="streams">📺 Стримы</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="chat-header">
                <div class="chat-title" id="currentChannel"># Общий чат</div>
                <div class="stream-controls">
                    <button id="streamScreenBtn" class="stream-btn">📺 Экран</button>
                    <button id="streamWindowBtn" class="stream-btn">🪟 Окно</button>
                </div>
            </div>
            
            <div id="chatArea" class="chat-area"></div>
            <div id="streamContainer" class="stream-container"></div>
            
            <div class="chat-input-area">
                <input type="text" id="messageInput" class="chat-input" placeholder="Напишите сообщение..." maxlength="500">
                <button id="sendBtn" class="send-btn">Отправить</button>
            </div>
        </div>
        
        <div class="users-panel">
            <div class="users-title">Участники</div>
            <div id="usersList"></div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>

# Конфигурация Netlify
[build]
  # Папка с файлами для деплоя
  publish = "."
  # Команда сборки (не требуется для статики)
  command = ""

# Перенаправления
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Заголовки безопасности
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Кэширование статических файлов
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Настройки для WebSocket (через внешний сервис)
[build.environment]
  # URL WebSocket сервера (можно переопределить в настройках Netlify)
  WS_URL = "wss://neon-discord-ws.glitch.me"

# Netlify Functions (если нужны)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"



